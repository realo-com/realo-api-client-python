[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "realo-api-client"
dynamic = ["version"]
description = "Official Python client for the Realo REST API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Realo" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/realo-com/api-client-python"
Documentation = "https://api.realo.com/docs"

[project.scripts]
realo-api = "realo_api.cli:main"

[tool.hatch.version]
path = "src/realo_api/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/realo_api"]
